<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Приглашение</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/fonts/fonts.css"><link rel="icon" href="/favicon.svg">
<style>
:root{--bg:#F6F3EE;--ink:#111;--mute:#6B6760;--line:rgba(17,17,17,.12);--or:#FF4D00;--s:"Playfair Display",Georgia,serif;--f:"TikTok Sans",system-ui,sans-serif;--m:"Geist Mono",ui-monospace,monospace;--g:clamp(18px,3vw,48px)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:#0d0d0d;color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased}
img{display:block;width:100%;height:100%;object-fit:cover}a{color:inherit;text-decoration:none}
.kick{font-family:var(--m);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.mast{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 16px) var(--g) 0;color:#fff;pointer-events:none;mix-blend-mode:difference}
.mast b{font-family:var(--s);font-weight:700;font-size:clamp(22px,2.6vw,40px);letter-spacing:.2em}
.sp{position:relative;display:block;height:100svh;min-height:560px;overflow:hidden;color:#fff;background:#111;cursor:pointer}
.sp img{position:absolute;inset:0;transform:scale(1.08);transition:transform 2.4s cubic-bezier(.16,1,.3,1)}
.sp.in img{transform:scale(1)}
.sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.4) 0%,rgba(0,0,0,0) 24%,rgba(0,0,0,0) 45%,rgba(0,0,0,.78) 100%)}
.sb{position:absolute;left:0;right:0;bottom:0;padding:0 var(--g) calc(env(safe-area-inset-bottom) + clamp(36px,8vh,84px));display:flex;flex-direction:column;gap:14px;max-width:1150px;opacity:0;transform:translateY(24px);transition:opacity 1s .2s,transform 1s .2s cubic-bezier(.16,1,.3,1)}
.sp.in .sb{opacity:1;transform:none}
.sh2{font-family:var(--s);font-weight:600;font-size:clamp(44px,7.2vw,120px);line-height:.95;letter-spacing:-.02em}
.sd{font-size:clamp(17px,1.5vw,22px);line-height:1.4;max-width:46ch;opacity:.92}
.sr{font-weight:600;font-size:15px;margin-top:4px}
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;opacity:0;visibility:hidden;transition:opacity .45s,visibility .45s;-webkit-overflow-scrolling:touch}
.ov.on{opacity:1;visibility:visible}
.ov-x{position:fixed;top:calc(env(safe-area-inset-top) + 14px);right:16px;z-index:2;width:46px;height:46px;border-radius:50%;border:0;background:rgba(17,17,17,.75);color:#fff;font-size:24px;line-height:1;cursor:pointer;backdrop-filter:blur(8px)}
.ov-in{display:grid;grid-template-columns:1.1fr 1fr;min-height:100svh}
.ov-img{margin:0;position:sticky;top:0;height:100svh}
.ov-img figcaption{position:absolute;left:12px;bottom:10px;font-size:10px;color:rgba(255,255,255,.8);font-family:var(--m);text-shadow:0 1px 3px rgba(0,0,0,.6)}
.ov-body{padding:clamp(40px,10vh,120px) clamp(20px,5vw,80px) 80px;display:flex;flex-direction:column;gap:22px;max-width:720px}
.ov-body>.kick{color:var(--mute)}
.ov-body h2{font-family:var(--s);font-weight:600;font-size:clamp(38px,4.6vw,76px);line-height:.98;letter-spacing:-.02em;margin:0}
.dek{font-size:clamp(19px,1.6vw,24px);line-height:1.4;margin:0;font-weight:500}
.txt{font-size:18px;line-height:1.65;color:#333;margin:0}
.txt::first-letter{font-family:var(--s);font-size:3.4em;float:left;line-height:.82;padding:6px 10px 0 0;font-weight:600;color:var(--ink)}
.facts{border-top:1px solid var(--line);margin:8px 0 0;padding:0}
.facts div{display:grid;grid-template-columns:130px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.45}
.facts dt{font-family:var(--m);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);padding-top:3px}.facts dd{margin:0}
.facts dd.ok{color:#00875F}.facts dd.q{color:#B26B00}
.facts a{text-decoration:underline;text-underline-offset:3px}
.cta{display:inline-flex;justify-content:space-between;align-items:center;gap:20px;align-self:flex-start;background:var(--ink);color:var(--bg);padding:16px 24px;border-radius:999px;font-weight:600;font-size:16px;transition:background .3s}
.cta:hover{background:var(--or)}
.end{margin-top:30px;padding-top:30px;border-top:1px solid var(--ink);font-family:var(--s);font-weight:600;font-size:clamp(26px,2.6vw,38px);line-height:1.1}
.ov-noimg{background:var(--ink)}
@media (max-width:900px){.ov-in{grid-template-columns:1fr}.ov-img{position:relative;height:62svh}.facts div{grid-template-columns:1fr;gap:4px}}
@media (prefers-reduced-motion:reduce){.sp img,.sb{transition:none;transform:none;opacity:1}}
.ms{position:fixed;z-index:11;top:calc(env(safe-area-inset-top) + 64px);left:0;right:0;display:flex;gap:26px;overflow-x:auto;padding:0 var(--g);scrollbar-width:none;mask-image:linear-gradient(90deg,#000 85%,transparent);-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);transition:opacity .7s,transform .7s cubic-bezier(.16,1,.3,1)}
.ms::-webkit-scrollbar{display:none}
.mast a.logo{pointer-events:auto;color:inherit}
.mf{position:fixed;z-index:11;left:0;right:0;top:calc(env(safe-area-inset-top) + 64px + var(--msh,34px));display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:8px;padding:0 var(--g);transition:opacity .7s,transform .7s cubic-bezier(.16,1,.3,1)}
.mf::-webkit-scrollbar{display:none}
.mf button{flex:none;font-family:var(--m);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:7px 12px 6px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.mf button.on{background:#fff;color:#111;border-color:#fff}
.md{position:fixed;z-index:11;left:var(--g);right:var(--g);bottom:calc(env(safe-area-inset-bottom) + 14px);margin:0;max-width:560px;font-size:12px;line-height:1.45;color:rgba(255,255,255,.78);text-shadow:0 1px 8px rgba(0,0,0,.5);transition:opacity .7s}
.mf.off,.md.off{opacity:0;pointer-events:none;transform:translateY(-10px)}
.sp.hid{display:none}

.ms a,.ms span{flex:none;color:rgba(255,255,255,.72);font-family:var(--m);font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding:6px 0;border-bottom:1px solid transparent;transition:color .3s,border-color .3s;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.ms a:hover,.ms a.cur{color:#fff;border-color:#fff}
.ms span.soon{color:rgba(255,255,255,.38);cursor:default}
.ms.off{opacity:0;transform:translateY(-10px);pointer-events:none}
/* Private Discovery: доступ, подарок, знаки */
.acct{pointer-events:auto;color:inherit;margin-left:14px;border-bottom:1px solid currentColor;padding-bottom:1px}
.gate{border:1px solid var(--line);border-radius:18px;padding:26px;background:#fff;display:flex;flex-direction:column;gap:14px}
.gate h3{font-family:var(--s);font-weight:600;font-size:28px;line-height:1.05;margin:0}
.gate p{margin:0;font-size:16px;line-height:1.5;color:#444}
.gate form{display:flex;gap:10px;flex-wrap:wrap}
.gate input[type=email]{flex:1 1 220px;font:inherit;font-size:17px;padding:15px 18px;border:1px solid #cfcac2;border-radius:999px;background:var(--bg);min-height:52px}
.btn{font:inherit;font-weight:600;font-size:16px;border:0;border-radius:999px;padding:15px 22px;background:var(--ink);color:var(--bg);cursor:pointer;min-height:52px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.hp{position:absolute;left:-9999px;opacity:0}
.note{font-size:14px;color:var(--mute)}
.note.err{color:#A32B00}.note.ok{color:#00704E}
.acts{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.done-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 0}
.done-row .lbl{font-size:15px;color:#444;flex:1 1 220px}
.chk{display:inline-flex;align-items:center;gap:10px;font:inherit;font-weight:600;font-size:16px;background:#fff;border:1px solid var(--ink);border-radius:999px;padding:13px 20px;cursor:pointer;min-height:50px}
.chk i{width:18px;height:18px;border:1.5px solid var(--ink);border-radius:50%;display:inline-block;position:relative}
.chk.on{background:var(--ink);color:var(--bg)}.chk.on i{border-color:var(--bg)}.chk.on i:after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--bg)}
.undo{font-size:14px;text-decoration:underline;text-underline-offset:3px;background:none;border:0;cursor:pointer;color:var(--mute)}
.inach{display:flex;gap:14px;align-items:center;font-size:15px;color:#333}
.inach>svg{width:54px;height:54px;flex:none}
.sheet{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45);opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
.sheet.on{opacity:1;visibility:visible}
.sheet-in{width:min(560px,100%);background:var(--bg);border-radius:22px 22px 0 0;padding:26px var(--g) calc(env(safe-area-inset-bottom) + 26px);transform:translateY(30px);transition:transform .45s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;gap:14px}
.sheet.on .sheet-in{transform:none}
.sheet h3{font-family:var(--s);font-size:28px;margin:0;font-weight:600}
.sheet textarea{font:inherit;font-size:16px;padding:14px;border:1px solid #cfcac2;border-radius:14px;min-height:84px;background:#fff;resize:vertical}
.sheet .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .grid .btn{width:100%}
.ach{background:var(--bg);color:var(--ink);padding:clamp(60px,12vh,120px) var(--g)}
.ach>h2{font-family:var(--s);font-weight:600;font-size:clamp(38px,5vw,72px);line-height:1;margin:0 0 10px;letter-spacing:-.02em}
.ach>p{max-width:60ch;font-size:17px;line-height:1.5;color:#444;margin:0 0 40px}
.ach-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.medal{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px}
.medal-h{display:flex;gap:16px;align-items:center}
.medal-h>svg{width:82px;height:82px;flex:none;transition:transform .9s cubic-bezier(.16,1,.3,1),filter .9s}
.medal-h>svg.up{animation:mup 1.6s cubic-bezier(.16,1,.3,1)}
@keyframes mup{0%{transform:scale(.86);filter:brightness(.8)}55%{transform:scale(1.04);filter:brightness(1.18)}100%{transform:scale(1);filter:none}}
.medal h3{font-family:var(--s);font-weight:600;font-size:23px;line-height:1.05;margin:0}
.medal .lv{font-family:var(--m);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-top:6px}
.medal p{margin:0;font-size:15px;line-height:1.45;color:#444}
.medal ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.medal li a{display:flex;gap:10px;align-items:baseline;font-size:15px;line-height:1.35}
.medal li b{flex:none;width:16px;height:16px;border:1.5px solid #9a958c;border-radius:50%;display:inline-block;transform:translateY(3px)}
.medal li.d b{background:var(--ink);border-color:var(--ink)}
.medal .msh{font-size:14px;text-decoration:underline;text-underline-offset:3px;align-self:flex-start;background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
.page{background:var(--bg);min-height:100svh;padding:calc(env(safe-area-inset-top) + 110px) var(--g) 80px;color:var(--ink)}
.page h1{font-family:var(--s);font-weight:600;font-size:clamp(40px,6vw,84px);line-height:.98;letter-spacing:-.02em;margin:0 0 18px}
.page .lead{font-size:19px;line-height:1.5;max-width:56ch;color:#333;margin:0 0 34px}
.form{display:flex;flex-direction:column;gap:16px;max-width:640px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:15px;font-weight:600}
.form input,.form textarea,.form select{font:inherit;font-weight:400;font-size:17px;padding:14px 16px;border:1px solid #cfcac2;border-radius:14px;background:#fff}
.form textarea{min-height:110px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.dirs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin:18px 0 40px}
.dirs .dc{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}
.dirs .dc h3{font-family:var(--s);font-size:24px;margin:0 0 8px}
.mini{display:flex;flex-wrap:wrap;gap:6px}.mini>svg{width:34px;height:34px}
.sharepage .sp{cursor:default}
.ov-body .lock{font-size:15px;color:var(--mute)}
.gate-min{display:flex;flex-direction:column;gap:14px;max-width:420px;margin-top:6px}.gate-min input[type=email]{font:inherit;font-size:18px;padding:0 0 12px;border:0;border-bottom:1px solid var(--ink);background:transparent;outline:none;border-radius:0}.gate-min input::placeholder{color:#9a958c}.gate-min .btn{align-self:flex-start}
[hidden]{display:none!important}

/* медальон: три истории — три сектора */
.coin{--cs:96px;position:relative;display:inline-block;width:var(--cs);height:var(--cs);border-radius:50%;flex:none;padding:calc(var(--cs)*.055);box-shadow:inset 0 0 0 1px #d3cdc2;background:transparent;transition:transform .6s cubic-bezier(.16,1,.3,1)}
.coin .cw{position:relative;display:block;width:100%;height:100%;border-radius:50%;overflow:hidden;background:#e8e3da}
.coin .cw img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(.85) brightness(1.08);opacity:.32;transition:filter 1s cubic-bezier(.16,1,.3,1),opacity 1s cubic-bezier(.16,1,.3,1)}
.coin .cw img.on{filter:none;opacity:1}
.coin .s0{clip-path:polygon(50% 50%,50% 0,100% 0,100% 78.9%)}
.coin .s1{clip-path:polygon(50% 50%,100% 78.9%,100% 100%,0 100%,0 78.9%)}
.coin .s2{clip-path:polygon(50% 50%,0 78.9%,0 0,50% 0)}
.coin .cl{position:absolute;left:5.5%;top:5.5%;width:89%;height:89%;pointer-events:none}
.coin .cl path{stroke:var(--bg);stroke-width:1.6;fill:none}
.coin.lv1{background:conic-gradient(from 200deg,#f7f7f7,#a7abb1,#eceef1,#878c93,#f7f7f7);box-shadow:0 6px 18px -10px rgba(0,0,0,.35)}
.coin.lv2{background:conic-gradient(from 200deg,#fff3c9,#b5862a,#f6d97c,#8a6416,#fff3c9);box-shadow:0 8px 22px -10px rgba(138,100,22,.55)}
.coin.lv3{background:conic-gradient(from 200deg,#3d3d3d,#050505,#2b2b2b,#000,#3d3d3d);box-shadow:0 10px 26px -10px rgba(0,0,0,.6)}
.coin.lv3 .cw{box-shadow:0 0 0 1px #c9a24a}
.coin.up{animation:cup 1.4s cubic-bezier(.16,1,.3,1)}
@keyframes cup{0%{transform:scale(.82) rotate(-25deg)}100%{transform:none}}
.medal-h .coin{--cs:84px}
@media (hover:hover){a:hover>.coin,.bd:hover .coin{transform:scale(1.04) rotate(-3deg)}}
@media (prefers-reduced-motion:reduce){.coin,.coin .cw img{transition:none}.coin.up{animation:none}}
/* шапка на светлых страницах не наезжает на текст */
body:has(.pf) .mast,body:has(.page) .mast{mix-blend-mode:normal;color:var(--ink);background:var(--bg);padding-bottom:16px;pointer-events:auto;box-shadow:0 1px 0 var(--line)}
/* финал статьи */
button{color:inherit}
.fin{display:flex;flex-direction:column;gap:44px;margin-top:18px;padding-top:34px;border-top:1px solid var(--line)}
.fin .cta{align-self:stretch;justify-content:space-between;padding:20px 26px;font-size:17px}
.post{display:flex;flex-direction:column;gap:14px}
.post-k{font-family:var(--m);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0}
.post-c{display:block;padding:0;border:0;background:none;cursor:pointer;border-radius:18px;overflow:hidden;transform:rotate(-1.2deg);box-shadow:0 22px 40px -22px rgba(20,16,10,.55);transition:transform .7s cubic-bezier(.16,1,.3,1),box-shadow .7s cubic-bezier(.16,1,.3,1);aspect-ratio:1200/630;background:#ddd}
.post-c img{display:block;width:100%;height:100%;object-fit:cover}
@media (hover:hover){.post-c:hover{transform:rotate(0) translateY(-3px);box-shadow:0 30px 50px -24px rgba(20,16,10,.6)}}
.post-c:active{transform:scale(.98)}
.post-t{margin:2px 0 0;font-size:14px;color:var(--mute)}
.shr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sh-b{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;padding:6px 0;cursor:pointer;font:inherit}
.sh-b svg{width:54px;height:54px;padding:15px;border-radius:50%;background:#fff;border:1px solid var(--line);fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:background .3s,stroke .3s,transform .4s cubic-bezier(.16,1,.3,1)}
.sh-b span{font-family:var(--m);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
@media (hover:hover){.sh-b:hover svg{background:var(--ink);stroke:var(--bg);transform:translateY(-2px)}}
.sh-b:active svg{transform:scale(.94)}
.post-n{min-height:18px;margin:0;font-size:14px;color:#2f7d4f}
.ser{display:flex;gap:18px;align-items:center}
.ser-c{background:none;border:0;padding:0;cursor:pointer;flex:none}
.ser-k{font-variant-numeric:lining-nums;font-family:var(--s);font-size:22px;line-height:1.1;margin:0 0 6px}
.ser-t{font-size:14px;line-height:1.45;color:#555;margin:0 0 8px}
.lnk{background:none;border:0;padding:0;font:inherit;font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.been{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;background:none;border:0;padding:4px 0;font:inherit;font-size:15px;color:var(--mute);cursor:pointer;margin:0}
.been i{width:18px;height:18px;border-radius:50%;border:1.5px solid #b4aea3;position:relative;transition:border-color .3s}
.been.on{color:var(--ink)}.been.on i{border-color:var(--ink)}.been.on i:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--ink)}
[data-full]{display:flex;flex-direction:column;gap:22px}
[data-full]:empty{display:none}
/* знак раздела на странице раздела */
.sb1{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.sb1 h2{font-family:var(--s);font-weight:600;font-size:clamp(34px,4vw,52px);line-height:1;margin:0 0 8px}
.sb1-l{font-family:var(--m);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0 0 14px}
.sb1-r{font-size:16px;line-height:1.5;color:#555;max-width:520px;margin:0}
.sb1-d{font-size:15px;margin:12px 0 0}.sb1-d a{text-decoration:underline;text-underline-offset:3px}
.sb1>div{flex:1 1 280px}
