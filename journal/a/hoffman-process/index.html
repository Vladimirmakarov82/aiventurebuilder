var sheet=document.createElement('div');sheet.className='sheet';sheet.innerHTML='<div class="sheet-in" role="dialog" aria-modal="true"><h3 id="gh">Подарить открытие</h3><p class="note" id="gs"></p><label class="row note" id="gpl" style="display:none"><input type="checkbox" id="gp"> Показать мой знак получателю</label><textarea id="gm" placeholder="Несколько слов от себя (необязательно)"></textarea><div class="grid"><button class="btn" data-ch="tg" type="button">Telegram</button><button class="btn" data-ch="wa" type="button">WhatsApp</button><button class="btn ghost" data-ch="copy" type="button">Скопировать ссылку</button><button class="btn ghost" data-ch="native" type="button">Другое…</button></div><p class="note" id="gn"></p><div id="ginv" hidden></div><button class="undo" type="button" data-close>Закрыть</button></div>';
document.body.appendChild(sheet);
var GIFT=null;
function inviteForm(box,target,targetTitle){box.hidden=false;box.innerHTML='<div class="gate" style="gap:10px"><h3 style="font-size:22px">Пригласить в Orbiq</h3><p>Приглашение дает полный доступ к журналу и откроет этот материал первым. Действует 30 дней, принять его можно только с указанной почты.</p><form class="form" data-inv><label>Имя<input name="first" required maxlength="60"></label><label>Фамилия<input name="last" required maxlength="60"></label><label>Почта<input name="email" type="email" required></label><label>Личное сообщение<textarea name="msg" maxlength="600" placeholder="Необязательно"></textarea></label><label class="row" style="font-weight:400"><input type="checkbox" name="showName" checked> Показать мое имя в приглашении</label><input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true"><button class="btn" type="submit">Создать приглашение</button><p class="note" data-in></p></form></div>';
 var f=box.querySelector('form');f.onsubmit=function(e){e.preventDefault();var b=f.querySelector('button'),n=f.querySelector('[data-in]');if(b.disabled)return;b.disabled=true;n.className='note';n.textContent='Создаем…';
  api('invite/create',{body:{first:f.first.value,last:f.last.value,email:f.email.value,msg:f.msg.value,showName:f.showName.checked,website:f.website.value,target:target||'',targetTitle:targetTitle||''}}).then(function(r){b.disabled=false;if(!r.ok){n.className='note err';n.textContent=r.error||'Не получилось';return}
   var link=r.link,t='Приглашение в Orbiq Journal'+(f.msg.value?'\n\n'+f.msg.value:'');
   box.innerHTML='<div class="gate" style="gap:10px"><h3 style="font-size:22px">Приглашение создано</h3><p>Отправьте ссылку удобным способом. Осталось приглашений: '+r.left+'.</p><div class="grid"><button class="btn" type="button" data-ich="tg">Telegram</button><button class="btn" type="button" data-ich="wa">WhatsApp</button><button class="btn ghost" type="button" data-ich="mail">Почта</button><button class="btn ghost" type="button" data-ich="copy">Скопировать</button>'+(navigator.share?'<button class="btn ghost" type="button" data-ich="native">Другое…</button>':'')+'</div><p class="note" data-icn>Отправка через приложение не считается доставкой: приглашение станет принятым, когда получатель подтвердит почту.</p></div>';
   box.onclick=function(e){var x=e.target.closest('[data-ich]');if(!x)return;var ch=x.getAttribute('data-ich');
    if(ch==='tg')window.open('https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent(t),'_blank');
    if(ch==='wa')window.open('https://wa.me/?text='+encodeURIComponent(t+'\n'+link),'_blank');
    if(ch==='mail')location.href='mailto:?subject='+encodeURIComponent('Приглашение в Orbiq Journal')+'&body='+encodeURIComponent(t+'\n\n'+link);
    if(ch==='copy'&&navigator.clipboard)navigator.clipboard.writeText(link).then(function(){box.querySelector('[data-icn]').textContent='Ссылка скопирована'});
    if(ch==='native'&&navigator.share)navigator.share({title:'Orbiq Journal',text:t,url:link}).catch(function(){})}})}}
window.OJ.inviteForm=inviteForm;
function gift(o){GIFT=o;var gi=document.getElementById('ginv');gi.hidden=true;gi.innerHTML='';
 if(ME){api('invite/list').then(function(r){if(r.left>0){gi.hidden=false;gi.innerHTML='<p class="note">Получатель увидит редакционное превью. Для полного доступа можно отправить персональное приглашение: свободных '+r.left+'.</p><button class="btn ghost" type="button" data-invite>Пригласить в Orbiq</button>';gi.querySelector('[data-invite]').onclick=function(){inviteForm(gi,o.kind==='badge'?o.path:(IDX[o.id]&&IDX[o.id].href)||o.path,o.title)}}})}
GIFT.s=rid();document.getElementById('gh').textContent=o.head||'Подарить открытие';document.getElementById('gs').textContent=o.title||'';document.getElementById('gm').value='';document.getElementById('gn').textContent='';
 var pl=document.getElementById('gpl');pl.style.display=(o.kind==='badge'&&o.level)?'flex':'none';document.getElementById('gp').checked=false;
 sheet.classList.add('on');sheet.querySelector('[data-ch=native]').style.display=navigator.share?'':'none';ev('share_intent',o.id,'',GIFT.s)}
window.OJ.gift=gift;
sheet.addEventListener('click',function(e){if(e.target===sheet||e.target.hasAttribute('data-close')){sheet.classList.remove('on');return}
 var b=e.target.closest('[data-ch]');if(!b||!GIFT)return;var ch=b.getAttribute('data-ch');
 var personal=GIFT.kind==='badge'&&GIFT.level&&document.getElementById('gp').checked;
 var url=location.origin+GIFT.path+'?s='+GIFT.s+(personal?'&lv='+GIFT.level:''),msg=document.getElementById('gm').value.trim(),text=(msg?msg+'\n\n':'')+GIFT.title;
 ev(GIFT.kind==='badge'?'badge_share':'share_click',GIFT.id,ch,GIFT.s);
 if(ch==='tg')window.open('https://t.me/share/url?url='+encodeURIComponent(url)+'&text='+encodeURIComponent(text),'_blank');
 if(ch==='wa')window.open('https://wa.me/?text='+encodeURIComponent(text+'\n'+url),'_blank');
 if(ch==='copy'){(navigator.clipboard?navigator.clipboard.writeText((msg?msg+'\n':'')+url):Promise.reject()).then(function(){document.getElementById('gn').textContent='Ссылка скопирована';ev('copy_ok',GIFT.id,'copy',GIFT.s)}).catch(function(){window.prompt('Ссылка',url)})}
 if(ch==='native'&&navigator.share)navigator.share({title:GIFT.title,text:msg||GIFT.title,url:url}).catch(function(){})});
document.addEventListener('click',function(e){var b=e.target.closest('[data-bshare]');if(!b)return;var a=achOf(b.getAttribute('data-bshare'));if(a){var n=ME?nOf(a):0;gift({kind:'badge',id:a.id,level:n,path:'/journal/badge/'+a.id+'/',head:'Поделиться открытием',title:'Три открытия: '+a.name})}});
// ---- вход ----
function gateHtml(){return '<div class="gate"><h3>Полный материал доступен участникам Orbiq Journal по персональному приглашению</h3><p>Участник журнала может пригласить трех человек из своего круга. Если приглашение уже есть, откройте ссылку из него.</p><details><summary class="note" style="cursor:pointer">Уже участник? Войти по ссылке на почту</summary><form data-gate style="margin-top:12px"><input type="email" name="email" required autocomplete="email" placeholder="Электронная почта участника" aria-label="Электронная почта"><input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true"><button class="btn" type="submit">Получить ссылку</button></form><p class="note" data-gn></p></details></div>'}
window.OJ.gateHtml=gateHtml;
document.addEventListener('submit',function(e){var f=e.target.closest('form[data-gate]');if(!f)return;e.preventDefault();var n=f.parentNode.querySelector('[data-gn]'),btn=f.querySelector('button');if(btn.disabled)return;btn.disabled=true;n.className='note';n.textContent='Отправляем…';
 ev('gate_submit',window.OJ_CUR||'');
 api('auth/request',{body:{email:f.email.value,website:f.website.value,ret:location.pathname+(window.OJ_CUR?'#'+window.OJ_CUR:''),ref:LS.get('oj_s')||''}}).then(function(j){btn.disabled=false;
  if(j.ok&&j.test_link){n.className='note ok';n.innerHTML='Тестовый режим предпросмотра: письмо не отправляется. <a href="'+esc(j.test_link)+'" style="text-decoration:underline">Войти по ссылке</a>'}
  else if(j.ok&&j.generic){n.className='note';n.textContent='Если этот адрес принадлежит участнику, на него придет ссылка для входа. Доступ к журналу открывается только по персональному приглашению.'}
  else if(j.ok){n.className='note ok';n.textContent='Письмо отправлено. Ссылка действует 30 минут.'}
  else{n.className='note err';n.textContent=j.error||'Не получилось, попробуйте еще раз'}})});
// ---- знаки раздела ----
function cardMini(i){var t=IDX[i]||{};return '<a class="dc" href="'+(t.href||'#'+i)+'" data-next style="display:block"><p class="kick" style="color:var(--mute)">'+esc(t.geo||'')+'</p><h3 style="font-size:20px">'+esc(t.title||i)+'</h3></a>'}
function renderAch(changed){var box=document.getElementById('achg');if(!box)return;
 box.innerHTML=ACH.map(function(a){var n=ME?nOf(a):0;return '<article class="medal" id="m-'+a.id+'"><div class="medal-h">'+medal(a,n)+'<div><h3>'+esc(a.name)+'</h3><div class="lv">'+LV[n]+' · '+n+'/3</div></div></div><p>'+esc(a.desc)+'</p><ol>'+a.items.map(function(i){var t=IDX[i]||{},st=opState(i);return '<li class="'+(st==='completed'?'d':'')+'"><a href="'+(t.href||('#'+i))+'"><b></b><span>'+esc(t.title||i)+(st==='explored'?' <em class="note">· изучено</em>':'')+'</span></a></li>'}).join('')+'</ol><button class="msh" type="button" data-bshare="'+a.id+'">Поделиться открытием</button></article>'}).join('');
 (changed||[]).forEach(function(c){var s=document.querySelector('#m-'+c.id+' svg');if(s&&c.to>c.from)s.classList.add('up')})}
var achSec=document.getElementById('ach');if(achSec&&'IntersectionObserver'in window){var seen=0;new IntersectionObserver(function(es){if(!seen&&es[0].isIntersecting){seen=1;ev('ach_open')}}).observe(achSec)}
// ---- статья ----
function levelMsg(a,c){var t=['','Первое открытие совершено.','Два открытия из трех.','Все три открытия совершены.'][c.to];return '<div class="gate" style="gap:10px"><div class="inach">'+medal(a,c.to,64).replace('class="emb','class="emb up')+'<div><h3 style="font-size:22px">'+esc(a.name)+'. '+LV[c.to]+'.</h3><p>'+t+'</p></div></div>'+nextHtml(a,c.to)+'</div>'}
function nextHtml(a,n){if(n>=1&&n<3){var rest=a.items.filter(function(i){return opState(i)!=='completed'});return '<p class="note">Впереди еще '+(rest.length===2?'две истории':'одна история')+'.</p><div class="dirs" style="margin:0">'+rest.map(cardMini).join('')+'</div>'}
 if(n===3){var pool=ACH.filter(function(x){return x.id!==a.id&&nOf(x)<3});if(pool.length){var x=pool[0];return '<p class="note">Близкий знак в этом разделе: «'+esc(x.name)+'».</p><div class="dirs" style="margin:0">'+cardMini(x.items[0])+'</div>'}}return ''}
function fill(id,root){window.OJ_CUR=id;var box=root.querySelector('[data-full]');if(!box)return;var t=IDX[id]||{};
 root.querySelectorAll('[data-gift]').forEach(function(g){if(g._b)return;g._b=1;g.addEventListener('click',function(){gift({kind:'article',id:id,path:'/journal/a/'+id+'/',title:t.title||document.title})})});
 root.querySelectorAll('.cta').forEach(function(c){if(c._b)return;c._b=1;c.addEventListener('click',function(){ev('org_open',id)})});
 if(!window.OJ_ME_READY){box.innerHTML='<p class="lock">Загружаем историю…</p>';return}
 if(!ME){box.innerHTML=gateHtml();ev('gate_view',id);return}
 box.innerHTML='<p class="lock">Загружаем историю…</p>';
 api('article',{q:'&id='+encodeURIComponent(id)}).then(function(j){
  if(j._s===401){ME=null;box.innerHTML=gateHtml();return}
  if(j._s===403){box.innerHTML='<p class="lock">Доступ к аккаунту приостановлен редакцией.</p>';return}
  if(j._s!==200){box.innerHTML='<p class="lock">История сейчас недоступна.</p>';return}
  var a=achOf(id),busy=false,msg='';ME.ops=ME.ops||{};ME.ops[id]=j.state==='not_explored'?undefined:j.state;if(!ME.ops[id])delete ME.ops[id];
  function row(){var st=opState(id),n=a?nOf(a):0;
   return '<div class="done-row">'+(st==='not_explored'?'<button class="chk" type="button" data-p="explore"><i></i>Отметить как изученное</button>':'<span class="chk on" style="cursor:default"><i></i>Изучено</span>')+
    (st==='completed'?'<span class="chk on" style="cursor:default"><i></i>Совершено</span><button class="undo" type="button" data-p="undo">Отменить отметку</button>':'<button class="chk" type="button" data-p="ask"><i></i>Я это сделал</button>')+
    '<span class="lbl">«Изучено» отмечает прочитанное. «Совершено» — то, что пережито в жизни. Знаки дают только совершенные открытия.</span></div>'+
    '<div data-ask hidden class="gate" style="gap:12px"><p style="font-weight:600;color:var(--ink)">Добавить это открытие к вашим достижениям?</p><div class="acts"><button class="btn" type="button" data-p="complete">Добавить</button><button class="btn ghost" type="button" data-p="no">Не сейчас</button></div></div>'+
    (msg||'')+(a?'<div class="inach">'+medal(a,n,54)+'<span>«'+esc(a.name)+'» — одно из трех открытий · '+n+'/3 <button class="undo" type="button" data-p="ach">Показать все три</button></span></div><div data-achx hidden>'+'<div class="dirs" style="margin:6px 0 0">'+a.items.map(cardMini).join('')+'</div></div>':'')}
  box.innerHTML='<p class="txt">'+j.text+'</p><dl class="facts">'+j.facts+'</dl><div data-row>'+row()+'</div>';
  box.addEventListener('click',function(e){var d=e.target.closest('[data-p]');if(!d)return;var p=d.getAttribute('data-p'),r=box.querySelector('[data-row]');
   if(p==='ask'){r.querySelector('[data-ask]').hidden=false;return}if(p==='no'){r.querySelector('[data-ask]').hidden=true;return}
   if(p==='ach'){r.querySelector('[data-achx]').hidden=false;ev('ach_open',a&&a.id);return}
   if(busy)return;busy=true;var prev=ME.ops[id];d.disabled=true;
   api('progress',{body:{id:id,type:p}}).then(function(res){busy=false;
    if(res._s!==200){d.disabled=false;if(res._s===401){box.innerHTML=gateHtml();return}msg='<p class="note err">'+esc(res.error||'Не сохранилось. Состояние не изменилось')+'</p>';if(prev)ME.ops[id]=prev;r.innerHTML=row();return}
    if(res.state==='not_explored')delete ME.ops[id];else ME.ops[id]=res.state;msg='';
    (res.changed||[]).forEach(function(c){if(c.to>c.from&&a&&c.id===a.id)msg=levelMsg(a,c)});
    r.innerHTML=row();renderAch(res.changed)})});
  box.addEventListener('click',function(e){if(e.target.closest('[data-next]'))ev('next_open',id)})})}
window.OJ_after=fill;

api('me').then(function(j){ME=j.user||null;window.OJ_ME_READY=1;var acct=document.getElementById('acct');if(acct){acct.textContent=ME?'Профиль':'Вход';acct.href='/journal/profile/'}
 renderAch();tips();if(window.OJ_CUR){var r=document.getElementById('ovin');if(r&&r.querySelector('[data-full]'))fill(window.OJ_CUR,r)}if(window.OJ_PAGE)window.OJ_PAGE(ME,j)});
function tips(){var b=document.getElementById('tipsb');if(!b)return;var CAT={food:'Еда',doctor:'Специалисты',asset:'Активы',service:'Сервисы'};
 if(!ME){b.innerHTML=gateHtml();return}
 b.innerHTML='<p class="note">Загружаем…</p>';
 api('tips').then(function(r){var list=(r.tips||[]);
  b.innerHTML='<div class="ach-g" style="margin-bottom:28px">'+(list.length?list.map(function(t){return '<article class="medal tip" data-t="'+t.cat+'"><p class="kick" style="color:var(--mute)">'+CAT[t.cat]+(t.city?' · '+esc(t.city):'')+(t.price?' · '+esc(t.price):'')+'</p><h3>'+esc(t.title)+'</h3><p>'+esc(t.why)+'</p>'+(t.until?'<p class="note">Актуально до '+esc(t.until)+'</p>':'')+(t.link?'<a class="msh" href="'+esc(t.link)+'" target="_blank" rel="noopener nofollow">Подробнее</a>':'')+'<p class="note">'+(t.author?'Рекомендует '+esc(t.author):'Рекомендация участника')+(t.note?' · редакция: '+esc(t.note):'')+'</p></article>'}).join(''):'<p class="note">Опубликованных рекомендаций пока нет. Первую можно отправить ниже.</p>')+'</div>'+
  '<details class="gate"><summary style="cursor:pointer;font-weight:600">Поделиться своей находкой</summary><form class="form" data-tip style="margin-top:14px"><label>Тип<select name="cat"><option value="food">Еда</option><option value="doctor">Специалист</option><option value="asset">Актив</option><option value="service">Сервис</option></select></label><label>Название<input name="title" required maxlength="140"></label><label>Город<input name="city" maxlength="80"></label><label>Почему это стоит больше своей цены<textarea name="why" required maxlength="1200"></textarea></label><label>Цена или условия<input name="price" maxlength="80"></label><label>Актуально до<input name="until" type="date"></label><label>Ссылка<input name="link" maxlength="500" placeholder="https://"></label><label class="row" style="font-weight:400"><input type="checkbox" name="credit"> Указать мое имя</label><input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true"><button class="btn" type="submit">Отправить редакции</button><p class="note" data-tn></p></form></details>';
  var f=b.querySelector('[data-tip]');f.onsubmit=function(e){e.preventDefault();var bt=f.querySelector('button'),n=f.querySelector('[data-tn]');if(bt.disabled)return;bt.disabled=true;
   api('tip/create',{body:{cat:f.cat.value,title:f.title.value,city:f.city.value,why:f.why.value,price:f.price.value,until:f.until.value,link:f.link.value,credit:f.credit.checked,website:f.website.value}}).then(function(x){bt.disabled=false;if(x.ok){f.reset();n.className='note ok';n.textContent='Спасибо. Редакция проверит находку перед публикацией.'}else{n.className='note err';n.textContent=x.error||'Не отправилось'}})}})}
var mfx=document.getElementById('mf');if(mfx)mfx.addEventListener('click',function(e){var bt=e.target.closest('button');if(!bt)return;var f=bt.getAttribute('data-f');document.querySelectorAll('.tip').forEach(function(t){t.style.display=(!f||t.getAttribute('data-t')===f)?'':'none'})});
window.OJ.state=function(){return ME};window.OJ.medal=medal;window.OJ.nOf=function(a){return nOf(a)};window.OJ.LV=LV;
})();
