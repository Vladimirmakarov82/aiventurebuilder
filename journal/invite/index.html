window.OJ_PAGE=function(ME){var b=document.getElementById('ib'),E=OJ.esc,t=new URLSearchParams(location.search).get('t')||'';
 OJ.api('invite/info',{q:'&t='+encodeURIComponent(t)}).then(function(r){

  return '<div class="done-row">'+(st==='not_explored'?'<button class="chk" type="button" data-p="explore"><i></i>Отметить как изученное</button>':'<span class="chk on" style="cursor:default"><i></i>Изучено</span>')+
   (st==='completed'?'<span class="chk on" style="cursor:default"><i></i>Совершено</span><button class="undo" type="button" data-p="undo">Отменить отметку</button>':'<button class="chk" type="button" data-p="ask"><i></i>Я это сделал</button>')+
   '<span class="lbl">«Изучено» отмечает прочитанное. «Совершено» — то, что пережито в жизни. Знаки дают только совершенные открытия.</span></div>'+
   '<div data-ask hidden class="gate" style="gap:12px"><p style="font-weight:600;color:var(--ink)">Добавить это открытие к достижениям?</p><div class="acts"><button class="btn" type="button" data-p="complete">Добавить</button><button class="btn ghost" type="button" data-p="no">Не сейчас</button></div></div>'+
   (msg||'')+(a?'<div class="inach">'+medal(a,n,54)+'<span>«'+esc(a.name)+'» — одно из трех открытий · '+n+'/3 <button class="undo" type="button" data-p="ach">Показать все три</button></span></div><div data-achx hidden>'+'<div class="dirs" style="margin:6px 0 0">'+a.items.map(cardMini).join('')+'</div></div>':'')}
 box.innerHTML='<div data-row>'+row()+'</div>';
 if(box._cl)return;box._cl=1;
 box.addEventListener('click',function(e){var d=e.target.closest('[data-p]');if(!d||!ME)return;var p=d.getAttribute('data-p'),r=box.querySelector('[data-row]');
  if(p==='ask'){r.querySelector('[data-ask]').hidden=false;return}if(p==='no'){r.querySelector('[data-ask]').hidden=true;return}
  if(p==='ach'){r.querySelector('[data-achx]').hidden=false;ev('ach_open',a&&a.id);return}
  if(busy)return;busy=true;var prev=ME.ops[id];d.disabled=true;
  api('progress',{body:{id:id,type:p}}).then(function(res){busy=false;
   if(res._s!==200){d.disabled=false;if(res._s===401){ME=null;fill(id,root);return}msg='<p class="note err">'+esc(res.error||'Не сохранилось. Состояние не изменилось')+'</p>';if(prev)ME.ops[id]=prev;r.innerHTML=row();return}
   if(res.state==='not_explored')delete ME.ops[id];else ME.ops[id]=res.state;msg='';
   (res.changed||[]).forEach(function(c){if(c.to>c.from&&a&&c.id===a.id)msg=levelMsg(a,c)});
   r.innerHTML=row();renderAch(res.changed)})});
 box.addEventListener('click',function(e){if(e.target.closest('[data-next]'))ev('next_open',id)})}

function tips(){var b=document.getElementById('tipsb');if(!b)return;var CAT={food:'Еда',doctor:'Специалисты',asset:'Активы',service:'Сервисы'};
 b.innerHTML='<p class="note">Загружаем…</p>';
 api('tips').then(function(r){var list=(r.tips||[]);
  b.innerHTML='<div class="ach-g" style="margin-bottom:28px">'+(list.length?list.map(function(t){return '<article class="medal tip" data-t="'+t.cat+'"><p class="kick" style="color:var(--mute)">'+CAT[t.cat]+(t.city?' · '+esc(t.city):'')+(t.price?' · '+esc(t.price):'')+'</p><h3>'+esc(t.title)+'</h3><p>'+esc(t.why)+'</p>'+(t.until?'<p class="note">Актуально до '+esc(t.until)+'</p>':'')+(t.link?'<a class="msh" href="'+esc(t.link)+'" target="_blank" rel="noopener nofollow">Подробнее</a>':'')+'<p class="note">'+(t.author?'Рекомендует '+esc(t.author):'Рекомендация участника')+(t.note?' · редакция: '+esc(t.note):'')+'</p></article>'}).join(''):'<p class="note">Опубликованных рекомендаций пока нет. Первую можно отправить ниже.</p>')+'</div>'+
  '<details class="gate"><summary style="cursor:pointer;font-weight:600">Поделиться своей находкой</summary>'+(ME?'<form class="form" data-tip style="margin-top:14px"><label>Тип<select name="cat"><option value="food">Еда</option><option value="doctor">Специалист</option><option value="asset">Актив</option><option value="service">Сервис</option></select></label><label>Название<input name="title" required maxlength="140"></label><label>Город<input name="city" maxlength="80"></label><label>Почему это стоит больше своей цены<textarea name="why" required maxlength="1200"></textarea></label><label>Цена или условия<input name="price" maxlength="80"></label><label>Актуально до<input name="until" type="date"></label><label>Ссылка<input name="link" maxlength="500" placeholder="https://"></label><label class="row" style="font-weight:400"><input type="checkbox" name="credit"> Указать мое имя</label><input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true"><button class="btn" type="submit">Отправить редакции</button><p class="note" data-tn></p></form>':'<div style="margin-top:14px">'+gateHtml()+'</div>')+'</details>';
  var f=b.querySelector('[data-tip]');f.onsubmit=function(e){e.preventDefault();var bt=f.querySelector('button'),n=f.querySelector('[data-tn]');if(bt.disabled)return;bt.disabled=true;
   api('tip/create',{body:{cat:f.cat.value,title:f.title.value,city:f.city.value,why:f.why.value,price:f.price.value,until:f.until.value,link:f.link.value,credit:f.credit.checked,website:f.website.value}}).then(function(x){bt.disabled=false;if(x.ok){f.reset();n.className='note ok';n.textContent='Спасибо. Редакция проверит находку перед публикацией.'}else{n.className='note err';n.textContent=x.error||'Не отправилось'}})}})}
var mfx=document.getElementById('mf');if(mfx)mfx.addEventListener('click',function(e){var bt=e.target.closest('button');if(!bt)return;var f=bt.getAttribute('data-f');document.querySelectorAll('.tip').forEach(function(t){t.style.display=(!f||t.getAttribute('data-t')===f)?'':'none'})});
