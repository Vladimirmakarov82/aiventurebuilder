<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive"><title>Orbiq · Журнал</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=TikTok+Sans:opsz,wdth,wght@12..36,75..150,300..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/fonts/fonts.css"><link rel="icon" href="/favicon.svg">
<style>
:root{--bg:#F6F3EE;--ink:#111;--mute:#6B6760;--line:rgba(17,17,17,.12);--or:#FF4D00;--s:"TikTok Sans",system-ui,sans-serif;--f:"TikTok Sans",system-ui,sans-serif;--m:"Geist Mono",ui-monospace,monospace;--g:clamp(18px,3vw,48px)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:#0d0d0d;color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased}
img{display:block;width:100%;height:100%;object-fit:cover}a{color:inherit;text-decoration:none}
.kick{font-family:var(--m);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.mast{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 16px) var(--g) 0;color:#fff;pointer-events:none;mix-blend-mode:difference}
.mast b{font-family:var(--s);font-weight:700;font-size:clamp(22px,2.6vw,40px);letter-spacing:.2em}
.sp{position:relative;display:block;height:100svh;min-height:560px;overflow:hidden;color:#fff;background:#111;cursor:pointer}
.sp img{position:absolute;inset:0;transform:scale(1.08);transition:transform 2.4s cubic-bezier(.16,1,.3,1)}
.sp.in img{transform:scale(1)}
.sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.4) 0%,rgba(0,0,0,0) 24%,rgba(0,0,0,0) 45%,rgba(0,0,0,.78) 100%)}
.sb{position:absolute;left:0;right:0;bottom:0;padding:0 var(--g) calc(env(safe-area-inset-bottom) + clamp(36px,8vh,84px));display:flex;flex-direction:column;gap:14px;max-width:1150px;opacity:0;transform:translateY(24px);transition:opacity 1s .2s,transform 1s .2s cubic-bezier(.16,1,.3,1)}
.sp.in .sb{opacity:1;transform:none}
.sh2{font-family:var(--s);font-weight:600;font-size:clamp(44px,7.2vw,120px);line-height:.95;letter-spacing:-.02em}
.sd{font-size:clamp(17px,1.5vw,22px);line-height:1.4;max-width:46ch;opacity:.92}
.sr{font-weight:600;font-size:15px;margin-top:4px}
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;opacity:0;visibility:hidden;transition:opacity .45s,visibility .45s;-webkit-overflow-scrolling:touch}
.ov.on{opacity:1;visibility:visible}
.ov-x{position:fixed;top:calc(env(safe-area-inset-top) + 14px);right:16px;z-index:2;width:46px;height:46px;border-radius:50%;border:0;background:rgba(17,17,17,.75);color:#fff;font-size:24px;line-height:1;cursor:pointer;backdrop-filter:blur(8px)}
.ov-in{display:grid;grid-template-columns:1.1fr 1fr;min-height:100svh}
.ov-img{margin:0;position:sticky;top:0;height:100svh}
.ov-img figcaption{position:absolute;left:12px;bottom:10px;font-size:10px;color:rgba(255,255,255,.8);font-family:var(--m);text-shadow:0 1px 3px rgba(0,0,0,.6)}
.ov-body{padding:clamp(40px,10vh,120px) clamp(20px,5vw,80px) 80px;display:flex;flex-direction:column;gap:22px;max-width:720px}
.ov-body>.kick{color:var(--mute)}
.ov-body h2{font-family:var(--s);font-weight:600;font-size:clamp(38px,4.6vw,76px);line-height:.98;letter-spacing:-.02em;margin:0}
.dek{font-size:clamp(19px,1.6vw,24px);line-height:1.4;margin:0;font-weight:500}
.txt{font-size:18px;line-height:1.65;color:#333;margin:0}
.txt::first-letter{font-family:var(--s);font-size:3.4em;float:left;line-height:.82;padding:6px 10px 0 0;font-weight:600;color:var(--ink)}
.facts{border-top:1px solid var(--line);margin:8px 0 0;padding:0}
.facts div{display:grid;grid-template-columns:130px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.45}
.facts dt{font-family:var(--m);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);padding-top:3px}.facts dd{margin:0}
.facts dd.ok{color:#00875F}.facts dd.q{color:#B26B00}
.facts a{text-decoration:underline;text-underline-offset:3px}
.cta{display:inline-flex;justify-content:space-between;align-items:center;gap:20px;align-self:flex-start;background:var(--ink);color:var(--bg);padding:16px 24px;border-radius:999px;font-weight:600;font-size:16px;transition:background .3s}
.cta:hover{background:var(--or)}
.end{margin-top:30px;padding-top:30px;border-top:1px solid var(--ink);font-family:var(--s);font-weight:600;font-size:clamp(26px,2.6vw,38px);line-height:1.1}
.ov-noimg{background:var(--ink)}
@media (max-width:900px){.ov-in{grid-template-columns:1fr}.ov-img{position:relative;height:62svh}.facts div{grid-template-columns:1fr;gap:4px}}
@media (prefers-reduced-motion:reduce){.sp img,.sb{transition:none;transform:none;opacity:1}}
</style></head><body>
<div class="mast"><b>ORBIQ</b><span class="kick">@@issue@@</span></div>
<main id="feed">@@spreads@@</main>
<div class="ov" id="ov" role="dialog" aria-modal="true"><button class="ov-x" id="ovx" type="button" aria-label="Закрыть">×</button><div class="ov-in" id="ovin"></div></div>
@@articles@@
<script>
(function(){
var S=[].slice.call(document.querySelectorAll('.sp'));
var io='IntersectionObserver'in window?new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){en.target.classList.add('in')}})},{threshold:.35}):null;
S.forEach(function(x){io?io.observe(x):x.classList.add('in')});
var ov=document.getElementById('ov'),ovin=document.getElementById('ovin'),cur=null;
function open(id,push){var tp=document.getElementById('t-'+id);if(!tp)return;cur=id;ovin.innerHTML='';ovin.appendChild(tp.content.cloneNode(true));ov.scrollTop=0;ov.classList.add('on');document.body.style.overflow='hidden';if(push)history.pushState({id:id},'','#'+id)}
function close(back){ov.classList.remove('on');document.body.style.overflow='';cur=null;if(back&&location.hash)history.pushState({},'',location.pathname+location.search)}
document.addEventListener('click',function(ev){var a=ev.target.closest('a.sp');if(!a)return;ev.preventDefault();open(a.getAttribute('href').slice(1),true)});
document.getElementById('ovx').addEventListener('click',function(){close(true)});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&cur)close(true)});
window.addEventListener('popstate',function(){var h=location.hash.slice(1);h?open(h,false):close(false)});
if(location.hash)open(location.hash.slice(1),false);
})();
</script></body></html>
